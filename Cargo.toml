[package]
name = "vram-bloat-killer"
version = "0.1.0"
edition = "2021"
description = "A Windows tray watchdog that catches browser GPU processes hoarding memory and restarts them without closing a tab."
license = "MIT"
authors = ["LordBonds"]
repository = "https://github.com/LordBonds/vram-bloat-killer"

[dependencies.windows]
version = "0.58"
features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
strip = true
